<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebastian Barraud — UX/UI Designer & Photographer</title>
<meta name="description" content="Sebastian Barraud is a senior UX/UI designer and photographer in Buenos Aires. Product design, branding, motion and print.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sebastian Barraud — UX/UI Designer & Photographer">
<meta property="og:description" content="Product design, branding, motion and print. Buenos Aires, Argentina.">
<meta name="theme-color" content="#F1EFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23121210'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FF4A1C'/%3E%3C/svg%3E">
<!--
  HOMEPAGE — "Paper" design with the full-bleed header

  Same structure as td-alexfolio (hero → intro → services → projects →
  numbers → contact) but in your current light palette and your own
  Artific display face. The name straddles the bottom edge of the hero
  reel, the intro lights up word by word as you scroll, services are an
  accordion, and the work grid is asymmetric with category filters.

  Reads your real content from data/site.js and data/projects.js.
  Project case studies open on work.html#/work/<slug>.
  Project cards open the case study on your current site.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/Artific-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Artific';src:url('fonts/Artific-Variable.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{
  --bg:#EDEBE6;
  --bg-2:#E3E0D9;
  --ink:#121210;
  --muted:#7A766D;
  --faint:#B9B5AC;
  --line:rgba(18,18,16,.14);
  --accent:#FF4A1C;
  --display:'Artific','Archivo','Helvetica Neue',Arial,sans-serif;
  --obli:"obli" 3.5467;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --pad:clamp(16px,3vw,48px);
  --ease:cubic-bezier(.2,.7,.15,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
em{font-style:normal;font-variation-settings:var(--obli)}

.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}

/* ---------- section scaffold ---------- */
.sec{display:grid;grid-template-columns:minmax(160px,1fr) 3fr;gap:clamp(24px,4vw,64px);padding:clamp(72px,9vw,140px) var(--pad);border-top:1px solid var(--line)}
.sec-lbl{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:6px}
.sec-lbl b{font-family:var(--display);font-size:22px;font-weight:600}
.sec-lbl span{color:var(--muted)}

/* intro — words light up on scroll */
.statement{font-family:var(--display);font-size:clamp(34px,4.6vw,76px);line-height:1.02;letter-spacing:-.025em;font-weight:500}
.statement .w{color:var(--faint);transition:color .4s}
.statement .w.on{color:var(--ink)}
.intro-copy{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:clamp(40px,5vw,72px);color:var(--muted);max-width:900px}

/* services accordion */
.acc{border-top:1px solid var(--line)}
.acc-item{border-bottom:1px solid var(--line)}
.acc-btn{width:100%;display:grid;grid-template-columns:56px 1fr auto 40px;align-items:center;gap:16px;padding:clamp(18px,2.2vw,30px) 0;text-align:left}
.acc-btn .t{font-family:var(--display);font-size:clamp(30px,4.2vw,68px);font-weight:600;letter-spacing:-.03em;line-height:1;transition:transform .5s var(--ease),font-variation-settings .5s}
.acc-btn:hover .t{transform:translateX(10px);font-variation-settings:var(--obli)}
.acc-btn .ic{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;position:relative;transition:background .3s,transform .5s var(--ease)}
.acc-btn .ic::before,.acc-btn .ic::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;background:currentColor;transform:translate(-50%,-50%)}
.acc-btn .ic::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .4s var(--ease)}
.acc-item.open .ic{background:var(--accent);border-color:var(--accent)}
.acc-item.open .ic::after{transform:translate(-50%,-50%) rotate(0)}
.acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.acc-item.open .acc-panel{grid-template-rows:1fr}
.acc-inner{overflow:hidden}
.acc-body{display:grid;grid-template-columns:56px 1fr 1fr;gap:16px;padding-bottom:32px}
.acc-body p{grid-column:2;color:var(--muted);max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:start}
.chips li{padding:7px 14px;border-radius:999px;background:var(--bg-2);font-size:14px}

/* work */
.work-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,56px)}
.work-head h2{font-family:var(--display);font-size:clamp(48px,7.5vw,128px);line-height:.85;letter-spacing:-.04em;font-weight:700}
.work-head h2 sup{font-family:var(--mono);font-size:.14em;color:var(--accent);vertical-align:top;letter-spacing:0;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;transition:background .3s,color .3s}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(24px,3vw,44px) clamp(14px,1.6vw,24px)}
.tile{grid-column:span 6;display:flex;flex-direction:column;gap:14px}
.tile:nth-child(4n+1){grid-column:span 7}
.tile:nth-child(4n+2){grid-column:span 5;margin-top:clamp(40px,8vw,140px)}
.tile:nth-child(4n+3){grid-column:span 5}
.tile:nth-child(4n+4){grid-column:span 7;margin-top:clamp(-100px,-5vw,-40px)}
.tile.hide{display:none}
.tile-img{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:var(--bg-2)}
.tile:nth-child(4n+1) .tile-img,.tile:nth-child(4n+4) .tile-img{aspect-ratio:5/4}
.tile-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.tile:hover .tile-img img{transform:scale(1.05)}
.tile-img .view{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;padding:12px 20px;border-radius:999px;background:var(--accent);color:var(--ink);font-weight:500;font-size:14px;transition:opacity .35s,transform .5s var(--ease)}
.tile:hover .view{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tile-txt{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.tile-txt h3{font-family:var(--display);font-size:clamp(22px,2.2vw,34px);font-weight:600;letter-spacing:-.02em;line-height:1.05}
.tile-txt .mono{color:var(--muted);white-space:nowrap}
.tile p{color:var(--muted);font-size:15px;max-width:520px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.archive{margin-top:clamp(72px,9vw,140px)}
.archive .hd{display:flex;justify-content:space-between;color:var(--muted);padding-bottom:14px}
.row{display:grid;grid-template-columns:48px 1.4fr 1fr 100px 24px;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line);transition:padding .45s var(--ease),background .3s}
.row:last-child{border-bottom:1px solid var(--line)}
.row h4{font-family:var(--display);font-size:clamp(20px,1.9vw,28px);font-weight:500;letter-spacing:-.02em}
.row .mono{color:var(--muted)}
.row .ar{transition:transform .4s var(--ease)}
.row:hover{padding-left:14px;padding-right:6px}
.row:hover .ar{transform:rotate(-45deg);color:var(--accent)}
.row.hide{display:none}
.peek{position:fixed;left:0;top:0;width:280px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;pointer-events:none;z-index:60;opacity:0;transform:translate(-50%,-50%) rotate(-3deg) scale(.8);transition:opacity .25s,transform .4s var(--ease)}
.peek.on{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
.peek img{width:100%;height:100%;object-fit:cover}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.nums div{padding:24px 20px 0 0;border-right:1px solid var(--line)}
.nums div:last-child{border-right:0}
.nums b{display:block;font-family:var(--display);font-size:clamp(48px,6vw,104px);font-weight:700;letter-spacing:-.04em;line-height:1}
.nums span{color:var(--muted)}
.tools{margin-top:clamp(40px,5vw,64px);font-family:var(--display);font-size:clamp(22px,2.4vw,38px);line-height:1.25;letter-spacing:-.02em;color:var(--faint)}
.tools b{color:var(--ink);font-weight:500}

/* contact */
.foot{background:var(--ink);color:var(--bg);padding:clamp(72px,9vw,140px) var(--pad) 24px;border-radius:28px 28px 0 0}
.foot .mono{color:#8C887F}
.big{display:block;font-family:var(--display);font-weight:800;font-size:clamp(72px,17vw,320px);line-height:.82;letter-spacing:-.045em;text-transform:uppercase;margin:24px 0 clamp(40px,5vw,72px);transition:font-variation-settings .6s var(--ease),color .4s}
.big:hover{font-variation-settings:var(--obli);color:var(--accent)}
.foot-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px;padding-top:24px;border-top:1px solid rgba(237,235,230,.16)}
.mail{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:clamp(20px,2vw,30px);font-family:var(--display)}
.copy{font-family:var(--sans);font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid rgba(237,235,230,.25);transition:background .3s,color .3s}
.copy:hover{background:var(--bg);color:var(--ink)}
.foot-row>div{display:flex;flex-direction:column;gap:6px}
.foot-row a.u{text-decoration:underline;text-underline-offset:4px}
.foot-bot{display:flex;justify-content:space-between;margin-top:clamp(48px,6vw,96px);color:#8C887F;font-size:14px}

/* ---------- header (full-bleed) ---------- */
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:500;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.avail{display:inline-flex;align-items:center;gap:8px}
.avail i{width:7px;height:7px;border-radius:50%;background:#3FA36B;box-shadow:0 0 0 0 rgba(63,163,107,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(63,163,107,0)}100%{box-shadow:0 0 0 0 rgba(63,163,107,0)}}
@keyframes rise{from{transform:translateY(30%);opacity:0}to{transform:none;opacity:1}}
.fit{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:.8;white-space:nowrap}
.fit .nm{display:inline-block}
.fit .nm>span,.fit .nm>em{animation:rise 1.2s var(--ease) both}
.fit .nm>em{animation-delay:.1s}
.vid{position:relative;overflow:hidden;background:#1a1c1a}
.vid video,.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lnk{position:relative}
.lnk::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
.lnk:hover::after{transform:scaleX(1);transform-origin:left}

/* compact bar that drops in once you scroll past the header */
.mini{position:fixed;top:12px;left:50%;transform:translate(-50%,-160%);z-index:60;display:flex;align-items:center;gap:2px;padding:6px 6px 6px 16px;background:rgba(18,18,16,.92);color:var(--bg);border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .55s var(--ease);font-size:14px;white-space:nowrap}
.mini.on{transform:translate(-50%,0)}
.mini .brand{margin-right:12px}
.mini a.l{padding:7px 12px;border-radius:999px;transition:background .3s}
.mini a.l:hover{background:rgba(255,255,255,.1)}
.mini a.go{background:var(--accent);color:var(--ink);padding:7px 14px;border-radius:999px;margin-left:4px}

.hv3{position:relative;height:100svh;min-height:620px;color:#fff;overflow:hidden;background:#111}
.hv3 .vid{position:absolute;inset:0}
.hv3 .vid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6))}
.v3-nav{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px var(--pad)}
.v3-nav nav{justify-self:end;display:flex;gap:26px}
.v3-nav .avail{color:rgba(255,255,255,.75)}
.v3-bot{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(28px,5vh,56px);z-index:2}
.v3-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:24px;align-items:end;padding-bottom:clamp(14px,2vh,24px);margin-bottom:clamp(10px,1.6vh,18px);border-bottom:1px solid rgba(255,255,255,.25)}
.v3-row p{font-size:clamp(16px,1.3vw,20px);max-width:460px;line-height:1.35}
.v3-row .mono{color:rgba(255,255,255,.7)}
.v3-row .cue{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.4);animation:bob 2.4s var(--ease) infinite}
@keyframes bob{50%{transform:translateY(6px)}}

@media (max-width:860px){
  .v3-nav{grid-template-columns:1fr auto}
  .v3-nav .avail{display:none}
  .v3-nav nav a:not(:last-child){display:none}
  .v3-row{grid-template-columns:1fr auto}
  .v3-row .hide-m{display:none}
  .hv3 .fit .nm>span,.hv3 .fit .nm>em{display:block}
  .v3-bot{bottom:84px}
  .mini .brand{display:none}
}

@media (max-width:860px){
  .hdr{grid-template-columns:1fr auto}
  .sec{grid-template-columns:1fr}
  .sec-lbl{position:static;flex-direction:row;gap:10px;align-items:baseline}
  .intro-copy{grid-template-columns:1fr}
  .acc-btn{grid-template-columns:36px 1fr 36px}
  .acc-btn .mono.c{display:none}
  .acc-body{grid-template-columns:1fr}
  .acc-body p{grid-column:1}
  .tile,.tile:nth-child(n){grid-column:1/-1;margin-top:0}
  .row{grid-template-columns:32px 1fr 24px}
  .row .cat,.row .v{display:none}
  .nums{grid-template-columns:1fr 1fr}
  .nums div{border-right:0;border-bottom:1px solid var(--line);padding-bottom:20px}
  .foot-row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .statement .w{color:var(--ink)}
}
</style>
</head>
<body>

<!-- compact bar that drops in after scrolling past the header -->
<div class="mini" id="mini"><a class="brand" href="#top"><span class="dot"></span><span class="bn"></span></a><a class="l" href="#work">Work</a><a class="l" href="#about">About</a><a class="go" href="#contact">Let’s talk</a></div>

<main id="top">
  <!-- ============ HEADER · FULL-BLEED ============ -->
  <section class="hv3">
    <div class="vid" data-video></div>
    <div class="v3-nav">
      <a class="brand" href="#top"><span class="dot"></span><span class="bn"></span></a>
      <span class="avail mono"><i></i>Available for new projects</span>
      <nav><a class="lnk" href="#work">Work</a><a class="lnk" href="#about">About</a><a class="lnk" href="#contact">Contact</a></nav>
    </div>
    <div class="v3-bot">
      <div class="v3-row">
        <p class="tl hide-m"></p>
        <span class="mono hide-m role"></span>
        <span class="mono"><span class="city"></span><br><span class="ck"></span></span>
        <a class="cue" href="#about" aria-label="Scroll down">↓</a>
      </div>
      <h1 class="fit nmh"></h1>
    </div>
  </section>



  <section class="sec" id="about">
    <div class="sec-lbl"><b>(01)</b><span>Intro</span></div>
    <div>
      <h2 class="statement" id="statement"></h2>
      <div class="intro-copy reveal" id="introCopy"></div>
    </div>
  </section>

  <section class="sec" id="services">
    <div class="sec-lbl"><b>(02)</b><span>Services</span></div>
    <div class="acc" id="acc"></div>
  </section>

  <section class="sec" id="work" style="grid-template-columns:1fr">
    <div>
      <div class="work-head">
        <h2 class="reveal">Selected <em>work</em><sup id="count"></sup></h2>
        <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="archive">
        <div class="hd mono"><span>(03) Archive</span><span id="archCount"></span></div>
        <div id="archive"></div>
      </div>
    </div>
  </section>

  <section class="sec" id="numbers">
    <div class="sec-lbl"><b>(04)</b><span>In numbers</span></div>
    <div>
      <div class="nums" id="nums"></div>
      <p class="tools reveal" id="tools"></p>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <span class="mono">(05) Contact — have a project in mind?</span>
  <a class="big" id="big" href="#">Let’s talk</a>
  <div class="foot-row">
    <div><span class="mono">Email</span><div class="mail"><a id="mail" href="#"></a><button class="copy" id="copyBtn" type="button">Copy</button></div></div>
    <div><span class="mono">Based in</span><span id="city"></span><span id="clock"></span></div>
    <div><span class="mono">Elsewhere</span><span id="links"></span></div>
  </div>
  <div class="foot-bot"><span id="cr"></span><a href="#top">Back to top ↑</a></div>
</footer>

<div class="peek" id="peek"><img alt=""></div>

<script src="data/site.js"></script>
<script src="data/projects.js"></script>
<script>
(function(){
  var S = window.SITE || {}, CATS = S.categories || {};
  var P = (window.PROJECTS || []).map(function(p,i){ return Object.assign({index:i}, p); });
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var yrs = function(f){ return new Date().getFullYear() - f; };
  var tok = function(t){ return String(t||'').replace(/\{years\}/g, yrs(S.careerStart||2009)).replace(/\{uxYears\}/g, yrs(S.uxStart||2014)); };
  var src = function(u){ return /^https?:/.test(u) ? u : u; };
  var big = function(u){ return u && u.indexOf('/projects/404/')>-1 ? u.replace('/projects/404/','/projects/808/') : u; };
  var cat = function(p){ return (CATS[p.category]||{}).label || p.category || 'Project'; };
  var link = function(p){ return 'work.html#/work/' + p.slug; };
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function cover(p){
    if (/placeholder/.test(p.img||'')) {
      var g = (p.blocks||[]).find(function(b){ return b.type==='gallery'; });
      if (g) return { u: src(g.images[0].src), pos: 'top' };
    }
    var remote = /^https?:/.test(p.img);
    return { u: remote ? big(p.img) : src(p.img), pos: p.imgPosition || 'center', fb: remote ? p.img : '' };
  }
  function imgTag(p){
    var c = cover(p);
    return '<img loading="lazy" src="'+esc(c.u)+'" alt="'+esc(p.alt||p.title)+'" style="object-position:'+esc(c.pos)+'"' +
      (c.fb ? ' onerror="this.onerror=null;this.src=\''+esc(c.fb)+'\'"' : '') + '>';
  }



  /* intro: split the statement into words that light up while scrolling */
  var A = S.about || {};
  var words = (tok(A.statement) + ' ' + tok((A.paragraphs||[])[0]||'').split('. ')[0] + '.').split(/\s+/);
  $('#statement').innerHTML = words.map(function(w){ return '<span class="w">'+esc(w)+'</span>'; }).join(' ');
  $('#introCopy').innerHTML = (A.paragraphs||[]).map(function(t){ return '<p>'+esc(tok(t))+'</p>'; }).join('');
  var ws = Array.prototype.slice.call(document.querySelectorAll('.statement .w'));
  function light(){
    var r = $('#statement').getBoundingClientRect(), vh = innerHeight;
    var prog = Math.min(1, Math.max(0, (vh*0.85 - r.top) / (r.height + vh*0.35)));
    var n = Math.round(prog * ws.length);
    ws.forEach(function(w,i){ w.classList.toggle('on', i < n); });
  }
  addEventListener('scroll', light, {passive:true}); light();

  /* services — edit the copy here */
  var SERVICES = [
    { t:'UX & Product', d:'Research-led interfaces for retail, healthcare, government and B2B platforms, from first flow to tested prototype.',
      items:['Interaction design','UX research','Prototyping','Usability testing','Visual design','Accessibility (WCAG)','HTML / CSS'] },
    { t:'Branding', d:'Identity systems that hold up from a website down to a single slide or an exhibition stand.',
      items:['Visual identity','Brand guidelines','Presentation templates','Event & exhibition','TV branding'] },
    { t:'Motion', d:'Movement that explains the product and gives a brand its rhythm.',
      items:['Motion design','Product walkthroughs','Broadcast graphics'] },
    { t:'Print & Photography', d:'The analog side: screenprint, illustration and documentary photography.',
      items:['Screenprint','Illustration','Street & documentary','Stage & live music'] }
  ];
  $('#acc').innerHTML = SERVICES.map(function(s,i){
    return '<div class="acc-item'+(i===0?' open':'')+'"><button class="acc-btn" aria-expanded="'+(i===0)+'"><span class="mono">'+pad(i+1)+'</span><span class="t">'+esc(s.t)+'</span>' +
      '<span class="mono c">('+pad(s.items.length)+')</span><span class="ic" aria-hidden="true"></span></button>' +
      '<div class="acc-panel"><div class="acc-inner"><div class="acc-body"><p>'+esc(s.d)+'</p><ul class="chips">' +
      s.items.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul></div></div></div></div>';
  }).join('');
  document.querySelectorAll('.acc-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var item = b.parentNode, open = !item.classList.contains('open');
      item.classList.toggle('open', open); b.setAttribute('aria-expanded', open);
    });
  });

  /* work */
  var feat = P.filter(function(p){ return p.blocks && p.blocks.length; });
  var rest = P.filter(function(p){ return !(p.blocks && p.blocks.length); });
  $('#count').textContent = '('+pad(P.length)+')';
  $('#grid').innerHTML = feat.map(function(p,i){
    return '<a class="tile reveal" data-cat="'+esc(p.category)+'" href="'+link(p)+'">' +
      '<div class="tile-img">'+imgTag(p)+'<span class="view">View case ↗</span></div>' +
      '<div class="tile-txt"><h3>'+esc(p.title)+'</h3><span class="mono">'+esc(cat(p))+(p.year?' · '+esc(p.year):'')+'</span></div>' +
      (p.summary ? '<p>'+esc(p.summary)+'</p>' : '') + '</a>';
  }).join('');
  $('#archCount').textContent = pad(rest.length) + ' projects';
  $('#archive').innerHTML = rest.map(function(p,i){
    var c = cover(p);
    return '<a class="row reveal" data-cat="'+esc(p.category)+'" href="'+link(p)+'" data-img="'+esc(c.u)+'" data-fb="'+esc(c.fb||'')+'">' +
      '<span class="mono">'+pad(i+1)+'</span><h4>'+esc(p.title)+'</h4><span class="mono cat">'+esc(cat(p))+'</span>' +
      '<span class="mono v">'+(p.views?esc(p.views)+' views':'Coming soon')+'</span><span class="ar">→</span></a>';
  }).join('');

  /* filters */
  var used = {}; P.forEach(function(p){ used[p.category] = (used[p.category]||0)+1; });
  var keys = Object.keys(CATS).filter(function(k){ return used[k]; });
  $('#filters').innerHTML = '<button aria-pressed="true" data-f="all">All</button>' +
    keys.map(function(k){ return '<button aria-pressed="false" data-f="'+k+'">'+esc(CATS[k].label)+'</button>'; }).join('');
  $('#filters').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x===b); });
    var f = b.dataset.f;
    document.querySelectorAll('.tile,.row').forEach(function(el){ el.classList.toggle('hide', f!=='all' && el.dataset.cat!==f); el.classList.add('in'); });
  });

  /* cursor peek */
  var peek = $('#peek'), pimg = peek.querySelector('img');
  if (matchMedia('(hover:hover) and (min-width:861px)').matches){
    document.querySelectorAll('.row').forEach(function(a){
      a.addEventListener('mouseenter',function(){ pimg.onerror=function(){ if(a.dataset.fb){ pimg.onerror=null; pimg.src=a.dataset.fb; } }; pimg.src=a.dataset.img; peek.classList.add('on'); });
      a.addEventListener('mouseleave',function(){ peek.classList.remove('on'); });
    });
    addEventListener('mousemove',function(e){ peek.style.left=e.clientX+'px'; peek.style.top=e.clientY+'px'; });
  }

  /* numbers */
  var stats = [{value:yrs(S.careerStart||2009), label:'Years creating'},{value:yrs(S.uxStart||2014), label:'Years in UX/UI'}].concat(A.stats||[]);
  $('#nums').innerHTML = stats.map(function(s,i){ return '<div class="reveal" style="--d:'+(i*.07)+'s"><b>'+esc(s.value)+'</b><span>'+esc(s.label)+'</span></div>'; }).join('');
  $('#tools').innerHTML = 'Working daily in ' + (A.tools||[]).map(function(t){ return '<b>'+esc(t)+'</b>'; }).join(', ') + '.';

  /* footer */
  $('#big').href = $('#mail').href = 'mailto:' + S.email;
  $('#mail').textContent = S.email;
  $('#city').textContent = S.city;
  $('#links').innerHTML = (S.links||[]).map(function(l){ return '<a class="u" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'; }).join(' · ');
  $('#cr').textContent = '© ' + new Date().getFullYear() + ' ' + S.name;
  $('#copyBtn').addEventListener('click', function(){
    var b = this;
    (navigator.clipboard ? navigator.clipboard.writeText(S.email) : Promise.reject()).then(function(){ b.textContent = 'Copied ✓'; setTimeout(function(){ b.textContent = 'Copy'; }, 1600); }).catch(function(){});
  });

  function tick(){
    var t = new Intl.DateTimeFormat('en-GB',{timeZone:S.timezone||'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit'}).format(new Date());
    $('#clock').textContent = t + ' local time'; document.querySelectorAll('.ck').forEach(function(c){ c.textContent = t + ' GMT-3'; });
  }
  tick(); setInterval(tick, 15000);

  /* header variants */
  var HV = S.heroVideo, fills = function(sel, v, html){ document.querySelectorAll(sel).forEach(function(e){ if(html) e.innerHTML = v; else e.textContent = v; }); };
  fills('.bn', S.name); fills('.city', S.city); fills('.role', S.role); fills('.tl', S.tagline || '');
  fills('.exp', yrs(S.careerStart||2009) + ' years');
  fills('.nmh', '<span class="nm"><span>'+esc(S.firstName)+'</span> <em>'+esc(S.lastName)+'</em></span>', true);
  document.querySelectorAll('[data-video]').forEach(function(box){
    if (HV && HV.src && !reduce) box.insertAdjacentHTML('afterbegin','<video autoplay muted loop playsinline poster="'+esc(src(HV.poster))+'"><source src="'+esc(src(HV.src))+'" type="video/mp4"></video>');
    else if (HV && HV.poster) box.insertAdjacentHTML('afterbegin','<img src="'+esc(src(HV.poster))+'" alt="">');
  });
  function fit(){
    document.querySelectorAll('.fit').forEach(function(el){
      if (!el.offsetParent) return;
      el.style.fontSize = '100px';
      var nm = el.querySelector('.nm'); if (!nm) return;
      el.style.fontSize = (100 * el.clientWidth / nm.getBoundingClientRect().width * 0.97) + 'px';
    });
  }
  document.querySelectorAll('[data-video] video').forEach(function(v){ v.play().catch(function(){}); });
  fit();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
  addEventListener('resize', fit);

  var mini = $('#mini');
  addEventListener('scroll', function(){
    var h = document.querySelector('.hv3');
    mini.classList.toggle('on', !!h && scrollY > h.offsetHeight - 80);
  }, {passive:true});

  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
})();
</script>
</body>
</html>
