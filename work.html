<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebastian Barraud — UX/UI Designer & Photographer</title>
<meta name="description" content="Sebastian Barraud is a senior UX/UI designer and photographer in Buenos Aires. Product design, branding, motion and print.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sebastian Barraud — UX/UI Designer & Photographer">
<meta property="og:description" content="Product design, branding, motion and print. Buenos Aires, Argentina.">
<meta name="theme-color" content="#F1EFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23121210'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FF4A1C'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">

<!-- Display typeface (Artific) is self-hosted, not from Google Fonts — see fonts/Artific-Variable.woff2 and the @font-face rule at the top of css/styles.css -->
<link rel="preload" href="fonts/Artific-Variable.woff2" as="font" type="font/woff2" crossorigin>

<!-- Set theme before first paint so there's no light/dark flash -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.classList.add('js');
  })();
</script>

<link rel="stylesheet" href="css/styles.css">

<!-- work.html only shows project case studies (#/work/<slug>).
     Any other address goes back to the homepage (index.html). -->
<script>
  (function () {
    var isProject = function () { return /^#\/work\/[^/]+/.test(location.hash); };
    if (!isProject()) { location.replace('index.html' + (location.hash || '')); return; }
    window.addEventListener('hashchange', function (e) {
      if (!isProject()) { e.stopImmediatePropagation(); location.replace('index.html' + (location.hash || '#work')); }
    });
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="siteHeader">
  <a class="brand" href="index.html" aria-label="Sebastian Barraud — home">
    <span class="brand-dot" aria-hidden="true"></span>
    <span id="brandName">Sebastian Barraud</span>
  </a>
  <nav class="site-nav" aria-label="Primary">
    <a href="index.html#work">Work</a>
    <a href="index.html#about">About</a>
    <a href="#contact" onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'});return false;">Contact</a>
  </nav>
  <div class="header-tools">
    <span class="clock" id="clock" aria-label="Local time in Buenos Aires"></span>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="main">

  <!-- ============ HOME ============ -->
  <div id="home">

    <section class="hero" id="top" aria-labelledby="heroTitle">
      <div class="hero-media" id="heroMedia" aria-hidden="true"></div>
      <div class="hero-top">
        <p class="hero-kicker"><span class="pulse" aria-hidden="true"></span><span id="heroKicker"></span></p>
      </div>

      <h1 class="hero-name" id="heroTitle">
        <span class="line"><span id="heroFirst">Sebastian</span></span>
        <span class="line line-2"><span><em id="heroLast">Barraud</em></span></span>
      </h1>

      <div class="hero-bottom">
        <p class="hero-tagline" id="heroTagline"></p>
        <dl class="hero-meta" id="heroMeta"></dl>
        <a class="hero-cue" href="#work" data-nav="work">
          <span>Selected work</span>
          <span class="hero-cue-count" id="heroCount"></span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>
        </a>
      </div>
    </section>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track" id="marquee"></div>
    </div>

    <section class="work" id="work" aria-labelledby="workTitle">
      <div class="work-head">
        <h2 class="section-title" id="workTitle">Selected <em>work</em><sup id="workCount"></sup></h2>
        <div class="view-toggle" role="group" aria-label="Layout">
          <button type="button" data-view="list" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>List
          </button>
          <button type="button" data-view="grid" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>Grid
          </button>
        </div>
      </div>

      <div class="filters" id="filters" role="group" aria-label="Filter projects by category"></div>
      <p class="sr-only" id="filterStatus" aria-live="polite"></p>

      <div id="workList" class="work-list" data-view="grid"></div>
    </section>

    <section class="about" id="about" aria-labelledby="aboutTitle">
      <p class="label">(About)</p>
      <div class="about-main">
        <h2 class="about-statement" id="aboutTitle"></h2>
        <div class="about-cols">
          <div class="about-copy" id="aboutCopy"></div>
          <figure class="about-portrait" id="aboutPortrait" hidden></figure>
        </div>
        <dl class="about-stats" id="aboutStats"></dl>
        <div class="about-lists">
          <div>
            <h3 class="mini-title">Capabilities</h3>
            <ol class="cap-list" id="skillList"></ol>
          </div>
          <div>
            <h3 class="mini-title">Tools</h3>
            <ul class="tool-list" id="toolList"></ul>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- ============ PROJECT PAGE (rendered by JS) ============ -->
  <article id="project" class="project" hidden></article>

  <noscript>
    <div style="padding:140px 24px 80px;max-width:640px">
      <h1>Sebastian Barraud</h1>
      <p>UX/UI designer &amp; photographer in Buenos Aires. This site needs JavaScript to show my work. You can also find it on <a href="https://www.behance.net/cotton">Behance</a>.</p>
    </div>
  </noscript>
</main>

<footer class="site-footer" id="contact">
  <p class="label">(Contact)</p>
  <a class="footer-big" id="footerBig" href="#">Let’s talk</a>
  <div class="footer-row">
    <a class="footer-email" id="footerEmail" href="#"></a>
    <button class="copy-btn" id="copyEmail" type="button">Copy email</button>
    <div class="footer-links" id="footerLinks"></div>
  </div>
  <div class="footer-bottom">
    <span>© <span id="year"></span> <span id="footName"></span></span>
    <span id="footWhere"></span>
    <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Back to top ↑</a>
  </div>
</footer>

<!-- cursor-following image preview (list view, desktop) -->
<div class="preview" id="preview" aria-hidden="true"><img alt="" id="previewImg"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- lightbox (click-to-enlarge for gallery blocks in a project's case study) -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous image">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img class="lb-img" id="lbImg" alt="" draggable="false">
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next image">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <p class="lb-count" id="lbCount"></p>
</div>

<script src="data/site.js"></script>
<script>window.SITE.heroVideo = null;</script>
<script src="data/projects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
